# Corre la revisión de sintaxis y las pruebas (npm test) en cada PR y en cada cambio a main.
# Node 20 y 22: la app no tiene build, así que lo que corre aquí es lo que se publica.
name: Pruebas
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pruebas:
    name: pruebas (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Un error de sintaxis en un módulo que ninguna prueba importa (p. ej. una vista de carga diferida)
      # no lo vería npm test; node --check sí, en todos los .js de src.
      - name: Revisar sintaxis de src/**/*.js
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm test
      # Informe de cobertura: solo informa, no fija ningún umbral ni hace fallar el trabajo.
      - name: Informe de cobertura (Node 22)
        if: matrix.node == 22
        continue-on-error: true
        run: |
          {
            echo '### Cobertura de pruebas (informativa, sin umbral)'
            echo '```'
            node --test --experimental-test-coverage tests/*.test.js | sed -n '/start of coverage report/,/end of coverage report/p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
