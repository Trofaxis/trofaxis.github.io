# Publica Trofaxis en GitHub Pages con la app empaquetada (npm run build → dist/). Ver docs/build.md.
# Requiere Settings › Pages › Build and deployment › Source: «GitHub Actions».
# Para volver a publicar sin build: Source «Deploy from a branch» (main, / (root)).
name: Publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Una publicación a la vez; si llegan dos cambios seguidos, no se cancela la que ya empezó.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@v4
