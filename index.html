<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>BioG.A.P.</title>
  <meta name="description" content="Prototipo de evaluación de riesgo ambiental de la finca, alineado a GLOBALG.A.P. IFA v6.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <header class="top"><div class="wrap bar">
    <div class="brand">BioG.A.P.<small>Riesgo ambiental de la finca</small></div>
    <div class="hright">
      <nav class="tabs" aria-label="Vistas">
        <button data-view="dashboard" id="tab-dashboard">Dashboard</button>
        <button data-view="wizard" id="tab-wizard">Cuestionario</button>
        <button data-view="plantillas" id="tab-plantillas">Plantillas</button>
        <button data-view="riego" id="tab-riego">Riego</button>
        <button data-view="fertilizacion" id="tab-fertilizacion">Fertilización</button>
        <button data-view="plaguicidas" id="tab-plaguicidas">Plaguicidas</button>
        <button data-view="casos" id="tab-casos">Casos</button>
        <button data-view="ajustes" id="tab-ajustes">Ajustes</button>
      </nav>
      <button class="btn sm" id="theme-btn" data-act="theme" aria-label="Cambiar tema">Tema: sistema</button>
    </div>
  </div></header>
  <main class="wrap" id="app" aria-live="polite"></main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
